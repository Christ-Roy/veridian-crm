# CI du fork : garde légale, tests patch-survival, image sur nos runners (loi 7).
# Déclenché par push uniquement : le dépôt est public, aucun pull_request ne doit
# pouvoir exécuter du code tiers sur un runner auto-hébergé.
name: veridian-crm-ci

on:
  push:
    branches: [staging, main]
    # Les apps Twenty vivent dans Veridian-site/veridian-crm-apps (CI propre) ; l app Android a sa CI telephonie-android.
    paths-ignore:
      - packages/twenty-apps/veridian/**
      - .github/workflows/telephonie-android.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Un push n'annule plus le run en cours (24/11/2026 : 4 runs annulés d'affilée, aucune image pendant 40 min). Il attend ;
# GitHub ne garde que le plus récent en attente. Runs courts : image et sabotages partent en parallèle.
concurrency:
  group: veridian-crm-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/christ-roy/veridian-crm

jobs:
  garde-legale:
    runs-on: [self-hosted, veridian-jit]
    timeout-minutes: 10
    steps:
      # Pas d'historique complet (2,6 Go, plus de 10 min) : le script récupère le marqueur seul.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/ci/check-ee-integrity.sh
      # Loi 7 outillée : refuse un runner hébergé si le dépôt devient privé (code 2 = visibilité illisible = rouge aussi).
      - run: bash scripts/ci/garde-runners.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: git clean -ffdx

  # Runners hébergés : dépôt PUBLIC, gratuits, aucun accès au parc (loi 7 = dépôts privés). Un job par script de sabotage :
  # en série ils prenaient 21 min sur un runner déjà occupé par l'image. Tous sont exigés.
  patch-survival:
    name: patch-survival (${{ matrix.script }})
    runs-on: ubuntu-latest
    needs: garde-legale
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Chaque comportement du §6bis.8.0 est retiré tour à tour : la spec doit casser à chaque fois.
        script:
          - patch-survival
          - mutations-connexion
          - mutations-identite-ia
          - mutations-jeton-action
          - mutations-catalogue
          - mutations-apps-mcp
          - mutations-outils-mcp
          - mutations-api-mcp
          - mutations-role-hub
          - mutations-organisation
          - mutations-suspension
          - mutations-suspension-cache
          - mutations-retrait-acces
          - mutations-identite-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.yarn/berry/cache
          key: yarn-serveur-${{ hashFiles('yarn.lock') }}
      - run: |
          node "$(sed -n 's/^yarnPath: //p' .yarnrc.yml)" workspaces focus twenty-monorepo twenty-server twenty-emails twenty-shared twenty-client-sdk
          npx nx run twenty-shared:build
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - run: bash "scripts/ci/${{ matrix.script }}.sh"
      # Un script de sabotage ajouté au dépôt et oublié ici ne serait jamais joué.
      - name: Aucun script de sabotage oublié
        if: matrix.script == 'patch-survival'
        run: |
          set -euo pipefail
          for f in scripts/ci/mutations-*.sh; do
            n="$(basename "$f" .sh)"
            grep -qxE " +- $n" .github/workflows/veridian-crm-ci.yaml || { echo "::error::$n absent de la matrice"; exit 1; }
          done

  # Suite unitaire jest de l'AMONT (Twenty) jouée sur notre code : un patch qui casse un comportement natif devient rouge.
  # Les échecs connus s'excluent nommément dans scripts/ci/tests-amont-exclus.txt (chemin exact + raison, jamais de joker).
  tests-amont:
    name: tests-amont (${{ matrix.nom }})
    runs-on: ubuntu-latest
    needs: garde-legale
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: shared, paquet: twenty-shared, shard: '', cible: serveur }
          - { nom: serveur-1, paquet: twenty-server, shard: 1/4, cible: serveur }
          - { nom: serveur-2, paquet: twenty-server, shard: 2/4, cible: serveur }
          - { nom: serveur-3, paquet: twenty-server, shard: 3/4, cible: serveur }
          - { nom: serveur-4, paquet: twenty-server, shard: 4/4, cible: serveur }
          - { nom: front-1, paquet: twenty-front, shard: 1/4, cible: front }
          - { nom: front-2, paquet: twenty-front, shard: 2/4, cible: front }
          - { nom: front-3, paquet: twenty-front, shard: 3/4, cible: front }
          - { nom: front-4, paquet: twenty-front, shard: 4/4, cible: front }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.yarn/berry/cache
          key: yarn-serveur-${{ hashFiles('yarn.lock') }}
      # Mesuré le 25/11 sur rise : sans twenty-emails ni twenty-client-sdk construits, 37 suites serveur échouent « Cannot find module ».
      - name: Préparer et construire les paquets voisins
        env:
          YARN_ENABLE_SCRIPTS: 'false'
          CIBLE: ${{ matrix.cible }}
        run: |
          set -euo pipefail
          if [ "$CIBLE" = front ]; then
            node "$(sed -n 's/^yarnPath: //p' .yarnrc.yml)" workspaces focus twenty-monorepo twenty-front twenty-shared twenty-ui
            npx nx run-many -t build -p twenty-shared twenty-ui
          else
            node "$(sed -n 's/^yarnPath: //p' .yarnrc.yml)" workspaces focus twenty-monorepo twenty-server twenty-emails twenty-shared twenty-client-sdk twenty-ui
            npx nx run-many -t build -p twenty-shared twenty-emails twenty-client-sdk twenty-ui
          fi
      - name: Jouer la suite de l'amont
        env:
          PAQUET: ${{ matrix.paquet }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Exclusions : chemin exact relatif au paquet, puis « | raison ». Un chemin disparu est une erreur (liste périmée).
          args=(--testPathIgnorePatterns '/node_modules/')
          while IFS= read -r ligne; do
            case "$ligne" in ''|'#'*) continue ;; esac
            chemin="${ligne%% | *}"
            raison="${ligne#* | }"
            [ "$chemin" != "$ligne" ] && [ -n "$raison" ] || { echo "::error::ligne sans raison : $ligne"; exit 1; }
            case "$chemin" in packages/$PAQUET/*) ;; *) continue ;; esac
            [ -f "$chemin" ] || { echo "::error::exclusion périmée, fichier absent : $chemin"; exit 1; }
            echo "exclu : $chemin ($raison)"
            args+=(--testPathIgnorePatterns "$(printf '%s' "/$chemin" | sed 's/[][\.^$*+?(){}|]/\\&/g')$")
          done < scripts/ci/tests-amont-exclus.txt
          cd "packages/$PAQUET"
          CI=true npx jest --config jest.config.mjs ${SHARD:+--shard="$SHARD"} --ci "${args[@]}"

  # En parallèle des tests. On ne déploie qu'un run vert en entier (jobs attendus par la session CRM).
  image:
    runs-on: ubuntu-latest
    needs: garde-legale
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node_modules du front et du serveur, deux fois : le disque libre du runner n'y suffit pas toujours.
      - run: (sudo rm -rf /usr/local/lib/android /opt/ghc >/dev/null 2>&1 &); df -h / | tail -1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          cleanup: false # retirer le builder prenait plus d'une minute ; le runner est jeté de toute façon
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nom
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=7 HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_name }}-$SHA" >> "$GITHUB_OUTPUT"
      # Pas de cache GitHub : son export coûte plus que ce qu'il rend (essayé le 24/11, Hub : 8 min).
      - name: Construire et pousser
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          provenance: false
          build-args: APP_VERSION=2.56.1-veridian-${{ steps.nom.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.nom.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
      - run: echo "$IMAGE:${{ steps.nom.outputs.tag }}@${{ steps.image.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Scan trivy du digest publié (rapport)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          scanners: vuln
          exit-code: '0'
          format: table
